<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zerodha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- navbar -->
    <div style="display: flex; justify-content: space-between; padding:20px; box-shadow: 2px 1px 2px #eee">
        <!-- Zerodha logo -->
        <div>
        <img width="150" src="/ZerodhaLandingPage/ZerodhaLogo.svg" alt="logo">
        </div>

        <!-- Nav links -->
        <div>
            <span style="padding: 15px; cursor: pointer;">SignUp</span>
            <span style="padding: 15px; cursor: pointer;">About</span>
            <span style="padding: 15px; cursor: pointer;">Products</span>
            <span style="padding: 15px; cursor: pointer;">Pricing</span>
            <span style="padding: 15px; cursor: pointer;">Support</span>
        </div>

    </div>
    

    <!-- main section -->

    <div style="padding-top: 80px; display:flex; justify-content: center; flex-direction: column; align-items: center; text-align: center;">

            <!-- Main img -->
             <img width="800px" src="/ZerodhaLandingPage/zerodhaMain.svg" alt="Center img">


             <div style="margin-top: 40px;">
                <h1><b>Invest in everything</b></h1>
                <p>Online platform to invest in stocks, derivatives, mutual funds, ETFs, bonds, and more.</p>
             </div>


             <!-- button -->
            <div style="margin-top: 30px;">
                <button style="color: white;background-color: #397ed1; padding:10px">
                    Sign Up for free
                </button>
            </div>


    </div>

    
</body>
</html>
